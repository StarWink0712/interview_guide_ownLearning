services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview-rebuild-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_guide_rebuild}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rebuild_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - interview_rebuild_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interview_rebuild_postgres_data:
